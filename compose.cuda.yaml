services:
  llama:
    image: ${LLAMA_CUDA_IMAGE:-ghcr.io/ggml-org/llama.cpp:server-cuda}
    gpus: all
    command:
      - --model
      - /models/${MODEL_FILE:-Qwen3-0.6B-Q8_0.gguf}
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --ctx-size
      - ${LLAMA_CONTEXT:-2048}
      - --batch-size
      - ${LLAMA_BATCH:-32}
      - --ubatch-size
      - ${LLAMA_UBATCH:-16}
      - --n-gpu-layers
      - ${LLAMA_GPU_LAYERS:-999}
      - --parallel
      - ${LLAMA_PARALLEL_SLOTS:-1}
      - --jinja
