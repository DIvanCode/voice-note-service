services:
  bot:
    build: .
    restart: unless-stopped
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?Set TELEGRAM_BOT_TOKEN in .env}
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      TRANSCRIPT_FILE: /data/transcriptions.log
      LLAMA_URL: http://llama:8080
      UPSTREAM_TIMEOUT: ${UPSTREAM_TIMEOUT:-180}
    volumes:
      - ./data:/data
      - whisper_cache:/cache
    depends_on:
      llama:
        condition: service_healthy

  llama:
    image: ${LLAMA_IMAGE:-ghcr.io/ggml-org/llama.cpp:server}
    restart: unless-stopped
    command:
      - --model
      - /models/${MODEL_FILE:-Qwen3-0.6B-Q8_0.gguf}
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --ctx-size
      - ${LLAMA_CONTEXT:-2048}
      - --batch-size
      - ${LLAMA_BATCH:-32}
      - --ubatch-size
      - ${LLAMA_UBATCH:-16}
      - --parallel
      - ${LLAMA_PARALLEL_SLOTS:-1}
      - --jinja
    environment:
      LLAMA_ARG_HOST: 0.0.0.0
    volumes:
      - ./extractor/models:/models:ro
    expose:
      - "8080"

volumes:
  whisper_cache:
