[project]
name = "voice-note-service"
version = "0.1.0"
description = "Telegram bot for converting agent voice notes into structured CRM notes"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiogram>=3.13,<4",
    "openai-whisper>=20240930",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.24,<2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
